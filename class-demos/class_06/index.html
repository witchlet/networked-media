<html>
<!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
<!-- A: information about the website, such as the title,
	the stylesheet used, any linked javascript files,
	and the character encoding. it does not show up
	on the webpage, but the title does show in the like
	tab thingy in the browser-->

<head>
    <title>class 5 demo 😌</title>
    <link href="style.css" rel="stylesheet" />
    <!-- NEW: link js file using <script> -->
    <script src="main.js"></script>
</head>

<!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
<!-- A: the body is like the everything that shows up on the page...
	<p> elements, <a> elements, <img> elements, etc...-->

<body>

    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>

    <!-- now open up style.css -->
</body>

</html>
